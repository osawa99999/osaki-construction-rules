<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大崎建設 スタンダードルール</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #e8f5e8 0%, #d4edda 100%);
            min-height: 100vh;
            color: #2c3e50;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        /* トップ画面 */
        .top-screen {
            display: block;
        }

        .top-screen.hidden {
            display: none;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .title h1 {
            font-size: 24px;
            font-weight: bold;
            color: #2c5530;
            line-height: 1.4;
        }

        .button-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-button {
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .menu-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        .menu-button:active {
            transform: translateY(0);
        }

        /* 濃い青ボタン（01-04） */
        .menu-button.primary {
            background: linear-gradient(135deg, #2c5aa0 0%, #1e4080 100%);
            color: white;
        }

        .menu-button.primary:hover {
            background: linear-gradient(135deg, #3a6bb0 0%, #2e5090 100%);
        }

        /* 薄い青ボタン（05-11） */
        .menu-button.secondary {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            color: #1565c0;
            border: 2px solid #90caf9;
        }

        .menu-button.secondary:hover {
            background: linear-gradient(135deg, #f3f8fd 0%, #d1e7fb 100%);
        }

        /* 動画画面 */
        .video-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 1000;
        }

        .video-screen.active {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-player {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
        }

        /* 縦向き時の動画サイズ調整 */
        @media (orientation: portrait) {
            .video-player {
                width: 100%;
                height: auto;
            }
        }

        /* 横向き時の動画サイズ調整 */
        @media (orientation: landscape) {
            .video-player {
                height: 100vh;
                width: auto;
            }
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #333;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            z-index: 1001;
        }

        .back-button:hover {
            background: white;
            transform: scale(1.1);
        }

        /* 横向き時の戻るボタン位置調整 */
        @media (orientation: landscape) {
            .back-button {
                top: 10px;
                left: 10px;
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
        }

        /* ロゴ */
        .logo {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 80px;
            height: auto;
            z-index: 999;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .logo:hover {
            opacity: 1;
        }

        /* スマホ横向き時のロゴサイズ調整 */
        @media (orientation: landscape) {
            .logo {
                width: 60px;
                bottom: 15px;
                right: 15px;
            }
        }

        .loading {
            color: white;
            font-size: 18px;
            text-align: center;
        }


    </style>
</head>
<body>
    <!-- トップ画面 -->
    <div class="top-screen" id="topScreen">
        <div class="container">
            <div class="title">
                <h1>大崎建設<br>スタンダードルール</h1>
            </div>
            
            <div class="button-list">
                <button class="menu-button primary" data-video="001_ark.mp4">01_アーク溶接</button>
                <button class="menu-button primary" data-video="002_kaik.mp4">02_開口部周り</button>
                <button class="menu-button primary" data-video="003_con.mp4">03_コンクリート打設</button>
                <button class="menu-button primary" data-video="004_syar.mp4">04_車両系建設機械混在作業</button>
                <button class="menu-button secondary" data-video="005_tam.mp4">05_玉掛け（長尺物）</button>
                <button class="menu-button secondary" data-video="006_renf.mp4">06_玉掛け（レンフロークランプ）</button>
                <button class="menu-button secondary" data-video="007_maru.mp4">07_台のこ（携帯用丸のこ等）</button>
                <button class="menu-button secondary" data-video="008_sind.mp4">08_打撃型振動工具</button>
                <button class="menu-button secondary" data-video="009_kure.mp4">09_小型移動式クレーン</button>
                <button class="menu-button secondary" data-video="010_back.mp4">10_バックホウアタッチメント交換</button>
                <button class="menu-button secondary" data-video="011_kuiu.mp4">11_ハンド型油圧杭打機</button>
            </div>
        </div>
    </div>

    <!-- 動画画面 -->
    <div class="video-screen" id="videoScreen">
        <button class="back-button" id="backButton">←</button>
        <div class="video-container">
            <video class="video-player" id="videoPlayer" controls preload="none">
                <source src="" type="video/mp4">
                お使いのブラウザは動画の再生に対応していません。
            </video>
        </div>
    </div>

    <!-- ロゴ -->
    <img src="OSARogo.png" alt="OSA Logo" class="logo">

    <script>
        // 要素の取得
        const topScreen = document.getElementById('topScreen');
        const videoScreen = document.getElementById('videoScreen');
        const videoPlayer = document.getElementById('videoPlayer');
        const backButton = document.getElementById('backButton');
        const menuButtons = document.querySelectorAll('.menu-button');

        // メニューボタンのクリックイベント
        menuButtons.forEach(button => {
            button.addEventListener('click', () => {
                const videoFile = button.getAttribute('data-video');
                showVideo(videoFile);
            });
        });

        // 戻るボタンのクリックイベント
        backButton.addEventListener('click', () => {
            hideVideo();
        });

        // ESCキーで戻る
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                hideVideo();
            }
        });

        // 動画表示関数
        function showVideo(videoFile) {
            // 動画のソースを設定
            videoPlayer.src = videoFile;
            
            // 画面を切り替え
            topScreen.classList.add('hidden');
            videoScreen.classList.add('active');
            
            // 動画を読み込み開始
            videoPlayer.load();
            
            // 少し遅延させてから再生開始（読み込み完了を待つ）
            setTimeout(() => {
                videoPlayer.play().catch(e => {
                    console.log('自動再生がブロックされました:', e);
                });
            }, 500);
        }

        // 動画非表示関数
        function hideVideo() {
            // 動画を停止
            videoPlayer.pause();
            videoPlayer.currentTime = 0;
            videoPlayer.src = '';
            
            // 画面を切り替え
            videoScreen.classList.remove('active');
            topScreen.classList.remove('hidden');
        }

        // 画面回転時の処理
        window.addEventListener('orientationchange', () => {
            // 回転後に動画サイズを再調整
            setTimeout(() => {
                if (videoScreen.classList.contains('active')) {
                    // 動画の表示を一旦リセットして再描画
                    videoPlayer.style.display = 'none';
                    setTimeout(() => {
                        videoPlayer.style.display = 'block';
                    }, 100);
                }
            }, 500);
        });

        // タッチイベントの最適化（スマホ用）
        document.addEventListener('touchstart', function(){}, {passive: true});
        
        // 動画の読み込み完了時の処理
        videoPlayer.addEventListener('loadeddata', () => {
            console.log('動画の読み込みが完了しました');
        });


    </script>
</body>
</html>
